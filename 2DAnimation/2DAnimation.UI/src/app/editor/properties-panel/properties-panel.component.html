<h2 class="panel-title">Properties</h2>
<p class="phase-note">No character selected. Selection and editing arrive in Phase 2 (transform) and Phase 3 (animation).</p>

<form class="fields" [formGroup]="form">
  <label>Position X <input type="number" formControlName="x" /></label>
  <label>Position Y <input type="number" formControlName="y" /></label>
  <label>Scale <input type="number" step="0.05" formControlName="scale" /></label>
  <label>Rotation (deg) <input type="number" formControlName="rotation" /></label>
  <label class="check"><input type="checkbox" formControlName="flipX" /> Flip horizontally</label>
  <label>Animation
    <select formControlName="animation"><option value="">(none)</option></select>
  </label>
  <label>Playback speed <input type="number" step="0.1" formControlName="speed" /></label>
  <label>Duration (ms) <input type="number" formControlName="duration" /></label>
  <label>Layer order <input type="number" formControlName="layer" /></label>
</form>
